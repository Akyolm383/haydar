<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Haydar Web Bridge</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      width: 290px;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 10px;
    }
    .header h2 {
      font-size: 15px;
      font-weight: 700;
      color: #10b981;
    }
    .status-card {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 9999px;
    }
    .badge-connected {
      background: rgba(16, 185, 129, 0.18);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.35);
    }
    .badge-disconnected {
      background: rgba(239, 68, 68, 0.18);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.35);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .dot-connected {
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    .dot-disconnected {
      background: #ef4444;
    }
    .info {
      font-size: 11px;
      color: #94a3b8;
    }
    .btn {
      width: 100%;
      background: #10b981;
      color: #042f2e;
      border: none;
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      transition: background 0.15s;
    }
    .btn:hover {
      background: #34d399;
    }
    .btn-secondary {
      background: #334155;
      color: #f1f5f9;
    }
    .btn-secondary:hover {
      background: #475569;
    }
    .tips {
      font-size: 11px;
      color: #64748b;
      margin-top: 10px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 20px;">🎙️</span>
    <div>
      <h2>Haydar Web Bridge</h2>
      <div class="info">ws://127.0.0.1:8765</div>
    </div>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span style="font-size: 12px; color: #cbd5e1;">Masaüstü Bağlantısı:</span>
      <span id="statusBadge" class="badge badge-disconnected">
        <span id="statusDot" class="dot dot-disconnected"></span>
        <span id="statusText">Bağlantı Yok</span>
      </span>
    </div>
    <div id="statusDesc" class="info">Haydar'ın açık olduğundan emin olun.</div>
  </div>

  <button id="btnReconnect" class="btn btn-secondary">🔄 Bağlantıyı Yenile</button>
  <button id="btnTestNext" class="btn">🎬 Sonraki Bölümü Test Et</button>
  <button id="btnTestScroll" class="btn btn-secondary">⬇️ Aşağı Kaydır Test Et</button>

  <div class="tips">
    💡 <b>İpucu:</b> Haydar açıkken mikrofona <i>"Haydar sonraki bölüm"</i> veya <i>"Haydar tıkla [buton]"</i> demeniz yeterlidir.
  </div>

  <script src="popup.js"></script>
</body>
</html>
